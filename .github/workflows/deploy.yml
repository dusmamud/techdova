# Deploy the TechDova demo (static SvelteKit build) to Cloudflare Pages.
# Trigger: every push to any branch, plus manual runs.
# main -> production deploy; any other branch -> preview deploy (Wrangler
# picks the branch/commit from the push; see wrangler-action README,
# "Deploy your Pages site (production & preview)").
# Quality gates (check/unit/build/e2e) run first in this same job and
# must all pass; a failing gate blocks the deploy.
#
# Required repo secrets (GitHub -> Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  - API token with the "Edit Cloudflare Pages" permission
#   CLOUDFLARE_ACCOUNT_ID - Account ID from the Cloudflare dashboard
# No other secrets. The demo needs no env vars to serve.
#
# PAGES_PROJECT_NAME must match the Cloudflare Pages project name exactly.
# If the project does not exist yet, the first deploy creates it; check in
# the Cloudflare dashboard afterwards that the production branch is `main`.
#
# NOTE: cloudflare/pages-action is deprecated/unavailable; the current
# official route is cloudflare/wrangler-action (v4, Wrangler v4).

name: Deploy to Cloudflare Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_PROJECT_NAME: techdova
  NODE_VERSION: "26"
  PNPM_VERSION: "12"

jobs:
  deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build static site
        run: pnpm build

      - name: E2E tests (against preview build)
        run: pnpm test:e2e

      # NOTE: the `secrets` context is NOT available in `if:` expressions
      # (GitHub rejects the whole workflow at parse time: "Unrecognized
      # named-value: 'secrets'"). Check presence via env vars in the shell
      # instead; values are never printed.
      - name: Check Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repo secrets. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under GitHub Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy build --project-name=${{ env.PAGES_PROJECT_NAME }}
